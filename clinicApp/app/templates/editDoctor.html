<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre Clinic - Add Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fb;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4a90e2;
            --background-color: #F3F6F9;
            --text-color: #2E2E3A;
            --border-color: #EBEEF6;
            --success-color: #2BC155;
            --warning-color: #FFA755;
            --danger-color: #FF5C75;
            --new-color: #8E44AD;
            --sidebar-width: 280px;
        }

        body {
            background-color: #f8f9fa;
            color: #272b41;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: var(--sidebar-width);
            background: #ffffff;
            padding: 20px;
            height: 100vh;
            position: fixed;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .logo span {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .menu-item a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 16px;
            margin-left: 12px;
            flex-grow: 1;
        }

        .menu-item:hover {
            background-color: rgba(59, 76, 184, 0.1);
        }

        .menu-item.active {
            background-color: var(--primary-color);
            color: white;
        }

        .menu-item.active a {
            color: white;
        }

        .menu-item i {
            font-size: 18px;
            color: var(--text-color);
        }

        .menu-item.active i {
            color: white;
        }

        .logout {
            padding: 12px 20px;
            color: #272b41;
            margin-top: auto;
            text-decoration: none;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px;
            flex: 1;
            width: 1620px;
        }

        .header {
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #2E2E3A;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            margin-bottom: 20px;
            color: #4a90e2;
            font-size: 16px;
        }

        .breadcrumb {
            color: #4a90e2;
            text-decoration: none;
        }

        .breadcrumb-active {
            color: #333;
        }

        .form-field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #2e2e2e;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="file"],
        input[type="password"],
        select {
            width: 80%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #f5f7fb;
            border-width: 2px;
            background-color: #fdfdff;
            border-color: #dadada;
            color: #2e2e2e;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #617dff;
            /* Neon green border on focus */
            box-shadow: 0 0 5px rgb(29, 68, 255);
        }

        .gender-option {
            display: inline-block;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            border-radius: 5px;
            padding: 10px;
            margin: 5px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked+.gender-option {
            background-color: #eef3fd;
            /* Light neon green */
            border-color: #6c87ff;
            /* Neon green border */
            box-shadow: 0 0 10px rgb(29, 68, 255);
            /* Neon glow effect */
        }

        .personal-info,
        .medical-info,
        .document-upload {
            margin-top: 30px;
            width: 90%;
            margin-left: 50px;
            padding: 20px;
            background-color: #fdfdfd;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgb(167, 169, 174);
        }

        .two-columns {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0px 20px;
        }

        .info {
            margin-top: 20px;
        }

        .btn {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 20px;
            margin-right: 70px;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .submit-button {
            margin-top: 30px;
            width: 200px;
            padding: 15px;
            background-color: #4a90e2;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 30px;
        }

        .cancel-button {
            margin-top: 30px;
            width: 200px;
            padding: 15px;
            background-color: white;
            border: none;
            border-radius: 8px;
            color: #4a90e2;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 30px;
        }

        .submit-button:hover {
            background-color: #4a90e2;
        }

        .cancel-button:hover {
            background-color: #cccccc;
        }

        .button-btn {
            margin-top: 30px;
            width: 200px;
            padding: 15px;
            background-color: white;
            border: none;
            border-radius: 8px;
            color: #4a90e2;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="https://picsum.photos/32/32?random=1" alt="Logo">
                <span>CarePuls</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-th-large"></i>
                <a href="/admin/dashboard">Дашборд</a>
            </div>
            <div class="menu-item  active">
                <i class="fas fa-user-md"></i>
                <a href="/admin/doctorsList">Врачи</a>
            </div>
            <div class="menu-item">
                <i class="fas fa-users"></i>
                <a href="/admin/patientsList">Пациенты</a>
            </div>
            <div class="menu-item">
                <i class="fas fa-calendar-alt"></i>
                <a href="/admin/appointmentList">Талоны</a>
            </div>
            <div class="menu-item">
                <i class="far fa-clock"></i>
                <a href="/admin/scheduleList">Графики</a>
            </div>
            <div class="menu-item">
                <i class="fas fa-hospital"></i>
                <a href="/admin/doctorLeaves">Заявления</a>
            </div>
            <a href='/' class="logout">Выход</a>
        </div>

        <div class="main-content">
            <div class="header">
                <h2>Редактировать врача</h2>
            </div>

            <div class="card">
                <div class="header">
                    <a href="/admin/doctorsList" class="breadcrumb">Врачи/</a>
                    <span class="breadcrumb-active">Редактирование врача</span>
                </div>

                <section class="content">
                    <form id="doctor-form">
                        <div class="two-columns">
                            <div class="form-field">
                                <label for="lastname">Фамилия</label>
                                <input type="text" id="lastname" name="lastname" placeholder="Введите фамилию" required>
                            </div>

                            <div class="form-field">
                                <label for="firstname">Имя</label>
                                <input type="text" id="firstname" name="firstname" placeholder="Введите имя" required>
                            </div>

                            <div class="form-field">
                                <label for="secondname">Отчество</label>
                                <input type="text" id="secondname" name="secondname" placeholder="Введите отчество"
                                    required>
                            </div>

                            <div class="form-field">
                                <label for="phone">Номер телефона</label>
                                <input type="text" id="phone" name="phone" placeholder="Введите номер телефона"
                                    required>
                            </div>

                            <div class="form-field">
                                <label for="email">Электронная почта</label>
                                <input type="email" id="email" name="email" placeholder="Введите email" required>
                            </div>

                            <div class="form-field">
                                <label for="dob">Дата рождения</label>
                                <input type="date" id="dob" name="dob" placeholder="Выберите дату рождения" required>
                            </div>

                            <div class="form-field">
                                <label>Пол</label>
                                <div>
                                    <input type="radio" id="male" name="gender" value="male" required>
                                    <label for="male" class="gender-option">Мужской</label>

                                    <input type="radio" id="female" name="gender" value="female">
                                    <label for="female" class="gender-option">Женский</label>
                                </div>
                            </div>

                            <div class="form-field">
                                <label for="department">Отделение</label>
                                <select id="department" name="department" required>
                                    <option value="">Выберите отделение</option>
                                </select>
                            </div>
                        </div>

                        <div class="education-info">
                            <h2>Образование</h2>
                            <div class="two-columns">
                                <div class="form-field">
                                    <label for="university">Университет</label>
                                    <input type="text" id="university" name="university"
                                        placeholder="Введите университет" required>
                                </div>

                                <div class="form-field">
                                    <label for="faculty">Факультет</label>
                                    <input type="text" id="faculty" name="faculty" placeholder="Введите факультет"
                                        required>
                                </div>

                                <div class="form-field">
                                    <label for="specialization">Специализация</label>
                                    <input type="text" id="specialization" name="specialization"
                                        placeholder="Введите специализацию" required>
                                </div>
                            </div>
                        </div>

                        <div class="address-info">
                            <h2>Адрес</h2>
                            <div class="two-columns">
                                <div class="form-field">
                                    <label for="country">Страна</label>
                                    <input type="text" id="country" name="country" placeholder="Введите страну"
                                        required>
                                </div>

                                <div class="form-field">
                                    <label for="city">Город</label>
                                    <input type="text" id="city" name="city" placeholder="Введите город" required>
                                </div>

                                <div class="form-field">
                                    <label for="street">Улица</label>
                                    <input type="text" id="street" name="street" placeholder="Введите улицу" required>
                                </div>

                                <div class="form-field">
                                    <label for="house">Дом</label>
                                    <input type="text" id="house" name="house" placeholder="Введите номер дома"
                                        required>
                                </div>

                                <div class="form-field">
                                    <label for="flat">Квартира</label>
                                    <input type="text" id="flat" name="flat" placeholder="Введите номер квартиры"
                                        required>
                                </div>
                            </div>
                        </div>

                        <div class="button-group">
                            <button type="submit" class="submit-button">Сохранить</button>
                            <button type="button" class="cancel-button"
                                onclick="window.location.href='/admin/doctorsList';">Отмена
                            </button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const urlSegments = window.location.pathname.split('/')
                const doctorId = urlSegments[urlSegments.length - 1]

                if (doctorId && doctorId !== 'addDoctor') {
                    // Load doctor data for editing
                    const doctorData = getDoctorData(doctorId)
                    populateForm(doctorData)
                }

                // Load departments
                loadDepartments()

                // Initialize Flatpickr for date inputs
                flatpickr('#dob', {
                    dateFormat: "Y-m-d",
                    maxDate: "today",
                    locale: "ru"
                })
            } catch (error) {
                alert('Ошибка загрузки данных врача: ' + error.message)
            }
        })

        function getDoctorData(doctorId) {
            // Mock data для Смирновой Марии
            const mockDoctor = {
                _id: 6,
                users: {
                    surname: "Смирнова",
                    name: "Мария",
                    patronymic: "Александровна",
                    phone_number: "+375 29 123-45-67",
                    email: "smirnova.ma@clinic.by",
                    gender: "female",
                    login: "smirnova.ma@clinic.by"
                },
                departments: {
                    department_name: "Терапия",
                    _id: 4
                },
                education: {
                    university: "Белорусский государственный медицинский университет",
                    faculty: "Лечебный факультет",
                    specialization: "Терапевт"
                },
                addresses: {
                    country: "Беларусь",
                    region: "Минская область",
                    city: "Минск",
                    street: "пр. Независимости",
                    house: "95",
                    flat: "42"
                },
                birthday: "1985-06-15"
            }

            return mockDoctor
        }

        function loadDepartments() {
            const departments = [
                { _id: 1, department_name: "Кардиология" },
                { _id: 2, department_name: "Неврология" },
                { _id: 3, department_name: "Педиатрия" },
                { _id: 4, department_name: "Терапия" },
                { _id: 5, department_name: "Хирургия" }
            ]

            const departmentSelect = document.getElementById('department')
            departments.forEach(department => {
                const option = document.createElement('option')
                option.value = department._id
                option.textContent = department.department_name
                departmentSelect.appendChild(option)
            })
        }

        function populateForm(data) {
            if (!data) return

            document.getElementById('lastname').value = data.users.surname || ''
            document.getElementById('firstname').value = data.users.name || ''
            document.getElementById('secondname').value = data.users.patronymic || ''
            document.getElementById('phone').value = data.users.phone_number || ''
            document.getElementById('email').value = data.users.email || ''
            document.getElementById('dob').value = data.birthday || ''

            const genderRadio = document.querySelector(`input[name="gender"][value="${data.users.gender}"]`)
            if (genderRadio) {
                genderRadio.checked = true
            }

            document.getElementById('department').value = data.departments._id || ''
            document.getElementById('university').value = data.education.university || ''
            document.getElementById('faculty').value = data.education.faculty || ''
            document.getElementById('specialization').value = data.education.specialization || ''
            document.getElementById('country').value = data.addresses.country || ''
            document.getElementById('city').value = data.addresses.city || ''
            document.getElementById('street').value = data.addresses.street || ''
            document.getElementById('house').value = data.addresses.house || ''
            document.getElementById('flat').value = data.addresses.flat || ''
        }

        document.getElementById('doctor-form').addEventListener('submit', async function (event) {
            event.preventDefault()

            const formData = new FormData(event.target)
            const doctorData = {
                users: {
                    surname: formData.get('lastname'),
                    name: formData.get('firstname'),
                    patronymic: formData.get('secondname'),
                    login: formData.get('email'),
                    phone_number: formData.get('phone'),
                    gender: formData.get('gender'),
                },
                birthday: formData.get('dob'),
                education: {
                    university: formData.get('university'),
                    faculty: formData.get('faculty'),
                    specialization: formData.get('specialization'),
                },
                addresses: {
                    country: formData.get('country'),
                    city: formData.get('city'),
                    street: formData.get('street'),
                    house: formData.get('house'),
                    flat: formData.get('flat'),
                },
                departments: {
                    _id: formData.get('department')
                }
            }

            try {
                const urlSegments = window.location.pathname.split('/')
                const doctorId = urlSegments[urlSegments.length - 1]

                if (doctorId && doctorId !== 'addDoctor') {
                    alert('Данные врача успешно обновлены')
                } else {
                    alert('Врач успешно добавлен')
                }

                window.location.href = '/admin/doctorsList'
            } catch (error) {
                console.error('Ошибка при сохранении:', error)
                alert('Произошла ошибка при сохранении данных. Пожалуйста, проверьте введенную информацию.')
            }
        })
    </script>
</body>

</html>
