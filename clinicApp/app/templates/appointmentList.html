            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary-color: #3B4CB8;
            --background-color: #F3F6F9;
            --text-color: #2E2E3A;
            --border-color: #EBEEF6;
            --success-color: #2BC155;
            --warning-color: #FFA755;
            --danger-color: #FF5C75;
            --new-color: #8E44AD;
            --sidebar-width: 280px;
        }

        body {
            background-color: var(--background-color);
            color: #525252;
        }

        :root {
            --primary-color: #4a90e2;
            --background-color: #F3F6F9;
            --text-color: #2E2E3A;
            --border-color: #EBEEF6;
            --success-color: #2BC155;
            --warning-color: #FFA755;
            --danger-color: #FF5C75;
            --new-color: #8E44AD;
            --sidebar-width: 280px;
        }

        body {
            background-color: #f8f9fa;
            color: #272b41;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: var(--sidebar-width);
            background: #ffffff;
            padding: 20px;
            height: 100vh;
            position: fixed;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .logo span {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .menu-item a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 16px;
            margin-left: 12px;
            flex-grow: 1;
        }

        .menu-item:hover {
            background-color: rgba(59, 76, 184, 0.1);
        }

        .menu-item.active {
            background-color: var(--primary-color);
            color: white;
        }

        .menu-item.active a {
            color: white;
        }

        .menu-item i {
            font-size: 18px;
            color: var(--text-color);
        }

        .menu-item.active i {
            color: white;
        }

        .logout {
            padding: 12px 20px;
            color: #272b41;
            margin-top: auto;
            text-decoration: none;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px;
            flex: 1;
            width: 1620px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #2E2E3A;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 8px;
            padding: 8px 15px;
            width: 280px;
            border: 1px solid #EBEEF6;
        }

        .search-bar i {
            color: #8A92A6;
            font-size: 16px;
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 14px;
            color: #525252;
        }

        /* Filter Section */
        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-input {
            background: white;
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 14px;
            color: #525252;
        }

        .filter-input::placeholder {
            color: #8A92A6;
        }

        .filter-input:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 0 3px rgba(9, 220, 164, 0.1);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .add-btn {
            background: var(--primary-color);
            color: white;
        }

        .delete-btn {
            background: #fd6666;
            color: white;
        }

        .refresh-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
        }

        /* Table Styles */
        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            font-weight: 600;
            color: #525252;
            font-size: 13px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        td {
            padding: 15px;
            font-size: 14px;
            color: #525252;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .status-approved {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            background: rgba(43, 193, 85, 0.1);
            color: var(--success-color);
        }

        .status-pending {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            background: rgba(255, 167, 85, 0.1);
            color: var(--warning-color);
        }

        .status-declined {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            background: rgba(255, 92, 117, 0.1);
            color: var(--danger-color);
        }

        .status-new {
            background: rgba(142, 68, 173, 0.1);
            color: var(--new-color);
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .employee-cell {
            display: flex;
            align-items: center;
        }

        .employee-name {
            font-weight: 500;
            color: #2E2E3A;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 20px;
            gap: 8px;
        }

        .page-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 14px;
            color: #525252;
        }

        .page-btn.active {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .export-buttons {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 8px;
        }

        .export-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 14px;
            color: #525252;
        }

        .actions-cell {
            width: 40px;
            text-align: center;
        }

        .actions-cell i {
            color: #8A92A6;
            cursor: pointer;

            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;

        /* Responsive Design */
        @media (max-width: 1200px) {
            .filters {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .logo span,
            .menu-item span {
                display: none;
            }

            .filters {
                grid-template-columns: 1fr 1fr;
            }
        }

</head>

            </div>

                    <input type="text" name="search_query" class="filter-input" placeholder="Поиск по ФИО врача...">
                    <input type="date" id="date-from" class="filter-input" name="from_date">
                    <input type="date" id="date-to" class="filter-input" name="to_date">
                    <select class="filter-input" name="status">
                        <option value="">Статус</option>
                        <option>Одобрено</option>
                        <option>Ожидание</option>
                        <option>Отклонено</option>
                    </select>
                    <button type="submit" class="search-button">Поиск</button>
                </div>
            </form>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div class="action-buttons">
                    <button class="action-btn add-btn" onclick="window.location.href='/admin/addAppointment'">
                        <i class="fas fa-plus"></i> Добавить
                    </button>
                    <button class="action-btn delete-btn" style="float: right;"
                        onclick="deleteSelected()">Удалить</button>
                    <button class="action-btn refresh-btn" onclick="fetchAppointments()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th></th>
                            <th>Врач</th>
                            <th>Пациент</th>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Статус</th>
                            <th>Причина</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-table-body">
                        <!-- Appointments will be dynamically inserted here -->
                    </tbody>
                </table>
                <div class="pagination" id="pagination">
                    <!-- Pagination controls will be inserted here -->
                </div>
            </div>
        </div>
    </div>

                    status: "Одобрено",
                    reason: "Повторная консультация"
                },
                {
                    id: 27,
                    doctor_first_name: "Мария",
                    doctor_last_name: "Смирнова",
                    patient_first_name: "Алексей",
                    patient_last_name: "Смирнов",
                    date: "2025-04-12",
                    time: "09:00",
                    status: "Одобрено",
                    reason: "Первичная консультация"
                }
            ]

            // Sort appointments by date in descending order
            allAppointments.sort((a, b) => {
                const dateA = new Date(a.date + 'T' + a.time)
                const dateB = new Date(b.date + 'T' + b.time)
                return dateB - dateA
            })

            displayAppointments()
            setupPagination()
        }

        function displayAppointments() {
            const tbody = document.getElementById('appointments-table-body')
            tbody.innerHTML = ''

            const startIndex = (currentPage - 1) * recordsPerPage
            const endIndex = startIndex + recordsPerPage
            const paginatedAppointments = allAppointments.slice(startIndex, endIndex)

            if (paginatedAppointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center;">Нет записей.</td></tr>`
                return
            }

            paginatedAppointments.forEach(app => {
                let stat
                if (app.status === "Ожидание" || app.status === "Pending") {
                    stat = 'pending'
                } else if (app.status === "Одобрено" || app.status === "Approved") {
                    stat = 'approved'
                } else {
                    stat = 'declined'
                }

                const row = document.createElement('tr')
                row.innerHTML = `
                <td><input type="checkbox" name="selectedRows" value="${app.id}"></td>
                <td>${app.doctor_first_name} ${app.doctor_last_name}</td>
                <td>${app.patient_first_name} ${app.patient_last_name}</td>
                <td>${app.date}</td>
                <td>${app.time}</td>
                    <td><span class="status-${stat}">${app.status}</span></td>
                <td>${app.reason || ''}</td>
                <td>
                    <button class="download-btn" style="background-color: transparent; border-color: transparent" onclick="redirectToPage(${app.id})">
                        <img width="40" height="40" src="https://img.icons8.com/pastel-glyph/40/4D4D4D/pencil--v2.png" alt="Edit"/>
                    </button>
                </td>
                `
                tbody.appendChild(row)
            })
        }

        function setupPagination() {
            const paginationContainer = document.getElementById('pagination')
            const totalPages = Math.ceil(allAppointments.length / recordsPerPage)

            let paginationHTML = ''

            paginationHTML += `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    Предыдущая
                </button>
            `

            for (let i = 1; i <= totalPages; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `
            }

            // Next button
            paginationHTML += `
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Следующая
                </button>
            `

            paginationContainer.innerHTML = paginationHTML
        }

        function changePage(newPage) {
            const totalPages = Math.ceil(allAppointments.length / recordsPerPage)
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage
                displayAppointments()
                setupPagination()
            }
        }

        function redirectToPage(appointmentId) {
            window.location.href = `/admin/addAppointment/${appointmentId}`
        }

        async function deleteSelected() {
            const checkboxes = document.querySelectorAll('input[name="selectedRows"]:checked')
            const ids = Array.from(checkboxes).map(cb => cb.value)

            if (!ids.length) {
                alert("Не выбрано ни одной записи.")
                return
            }

            for (const id of ids) {
                try {
                    const res = await fetch(`/admin/appointments/delete?appointment_id=${id}`, {
                        method: 'DELETE'
                    })

                    if (!res.ok) {
                        const err = await res.json()
                        console.error(`Failed to delete ID ${id}:`, err.detail)
                    }
                } catch (e) {
                    console.error(`Error deleting ID ${id}:`, e)
                }
            }

            await fetchAppointments()
        }
    </script>
</body>

</html>
