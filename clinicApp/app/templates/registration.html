<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePulse — Регистрация</title>
    <link rel="stylesheet" href="../static/registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .error-message {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #e74c3c;
            color: #fff;
            padding: 20px;
            height: 60px;
            border-radius: 5px;
            display: none;
            font-size: 20px;
        }

        .reg {
            color: #262626;
            margin-left: 100px;
        }

        .success-message {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
<div class="logo">CarePulse</div>

<div class="container">
    <h1 style="color: #1e1e1e; margin-bottom: 20px">Регистрация</h1>
    <div class="form-section">
        <form class="form">
            <div class="form-field">
                <label for="email">Электронная почта</label>
                <div class="input-wrapper">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
            </div>

            <div class="form-field">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                    <span class="icon toggle-password" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="form-field">
                <label for="repeat_password">Повторите пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="repeat_password" name="repeat_password" placeholder="Повторите пароль" required>
                    <span class="icon toggle-rpassword" onclick="togglePasswordVisibility1()">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <a href="/login" class="reg">Уже есть аккаунт? Войдите!</a>
            <button type="submit" class="submit-button">Зарегистрироваться</button>
        </form>
    </div>
</div>

<div id="error-message" class="error-message"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('.form');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const repeatPassword = document.getElementById('repeat_password').value;

            if (password !== repeatPassword) {
                showError('Пароли не совпадают');
                return;
            }

            try {
                const response = await fetch('/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        login: email,
                        password: password,
                        role_id: 1  // По умолчанию пациент, можно сделать выбор роли отдельно
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Регистрация успешна! Перенаправляем...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showError(data.detail || 'Ошибка при регистрации');
                }
            } catch (err) {
                console.error('Registration error:', err);
                showError('Ошибка сервера. Повторите позже.');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('success-message');
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }

        function showSuccess(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('success-message');
            errorMessage.style.display = 'block';
        }

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function togglePasswordVisibility1() {
            const repeatPasswordField = document.getElementById('repeat_password');
            const icon = document.querySelector('.toggle-rpassword i');
            if (repeatPasswordField.type === 'password') {
                repeatPasswordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                repeatPasswordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    });
</script>
</body>
</html>
