<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CarePulse - Авторизация</title>
    <link rel="stylesheet" href="../static/auth.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        .error-message {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #e74c3c;
            color: #fff;
            padding: 20px;
            height: 60px;
            border-radius: 5px;
            display: none;
            font-size: 20px;
        }

        .reg {
            color: #262626;
            margin-left: 100px;
        }
    </style>
</head>

<body>
<div class="logo">CarePulse</div>

<div class="container">
    <h1 style="color: #1e1e1e; margin-bottom: 20px">Вход в систему</h1>
    <div class="form-section">

        <form class="form">
            <div class="form-field">
                <label for="email">Электронная почта</label>
                <div class="input-wrapper">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required/>
                </div>
            </div>

            <div class="form-field">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required/>
                    <span class="icon toggle-password" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <a href="/registration" class="reg">Нет аккаунта? Зарегистрируйтесь!</a>
            <button type="submit" class="submit-btn">Войти</button>
        </form>
    </div>
</div>

<div id="error-message" class="error-message"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.querySelector('.form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        login: email,
                        password: password
                    })
                });

                if (response.ok) {
                    const meResponse = await fetch('/auth/me/', {
                        method: 'GET',
                        credentials: 'include'
                    });

                    if (meResponse.ok) {
                        const user = await meResponse.json();
                        if (user.role_id === 2) {
                            window.location.href = `/doctor/dashboard?id=${user._id}`;
                        } else if (user.role_id === 1) {
                            window.location.href = `/patientDashboard?id=${user._id}`;
                        } else if (user.role_id === 3) {
                            window.location.href = `/admin/dashboard`;
                        } else {
                            showError('Неизвестная роль пользователя');
                        }
                    } else {
                        showError('Не удалось получить данные пользователя');
                    }
                } else {
                    const errorData = await response.json();
                    showError(errorData.detail || 'Неверная почта или пароль');
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
                console.error('Login error:', error);
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';

            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password i');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    });
</script>

</body>
</html>
