<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre Clinic - Doctor Schedules</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary-color: #4a90e2;
            --background-color: #F3F6F9;
            --text-color: #2E2E3A;
            --border-color: #EBEEF6;
            --success-color: #2BC155;
            --warning-color: #FFA755;
            --danger-color: #FF5C75;
            --new-color: #8E44AD;
            --sidebar-width: 280px;
        }

        body {
            background-color: var(--background-color);
            color: #272b41;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: var(--sidebar-width);
            background: #ffffff;
            padding: 20px;
            height: 100vh;
            position: fixed;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .logo span {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .menu-item a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 16px;
            margin-left: 12px;
            flex-grow: 1;
        }

        .menu-item:hover {
            background-color: rgba(59, 76, 184, 0.1);
        }

        .menu-item.active {
            background-color: var(--primary-color);
            color: white;
        }

        .menu-item.active a {
            color: white;
        }

        .menu-item i {
            font-size: 18px;
            color: var(--text-color);
        }

        .menu-item.active i {
            color: white;
        }

        .logout {
            padding: 12px 20px;
            color: #272b41;
            margin-top: auto;
            text-decoration: none;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px;
            flex: 1;
            width: 1620px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #2E2E3A;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 8px;
            padding: 8px 15px;
            width: 280px;
            border: 1px solid #EBEEF6;
        }

        .search-bar i {
            color: #8A92A6;
            font-size: 16px;
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 14px;
            color: #525252;
        }

        /* Layout */
        .content-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .calendar-section {
            flex: 2;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .doctors-section {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
        }

        /* Calendar */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-navigation {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .month-title {
            font-size: 20px;
            font-weight: 600;
            min-width: 180px;
            text-align: center;
        }

        .nav-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #3a7bc8;
        }

        .department-select {
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 14px;
            color: #525252;
            background: white;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            padding: 8px;
            color: var(--text-color);
            font-size: 14px;
        }

        .calendar-day {
            min-height: 100px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            background: white;
            transition: all 0.2s ease;
        }

        .calendar-day:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 5px;
            text-align: right;
        }

        .day-shifts {
            font-size: 12px;
        }

        .shift-morning {
            background: rgba(74, 144, 226, 0.1);
            color: var(--primary-color);
            padding: 2px 5px;
            border-radius: 4px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
        }

        .shift-evening {
            background: rgba(142, 68, 173, 0.1);
            color: var(--new-color);
            padding: 2px 5px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .shift-time {
            font-size: 10px;
            margin-left: 5px;
            opacity: 0.8;
        }

        .current-day {
            background-color: rgba(74, 144, 226, 0.1);
            border-color: var(--primary-color);
        }

        .other-month {
            opacity: 0.4;
            background-color: #f9f9f9;
        }

        /* Doctors Table */
        .doctors-search {
            margin-bottom: 15px;
        }

        .doctors-search input {
            width: 100%;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 14px;
        }

        .doctors-table {
            flex-grow: 1;
            overflow-y: auto;
        }

        .doctors-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .doctors-table th {
            text-align: left;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #525252;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: white;
        }

        .doctors-table td {
            padding: 10px;
            font-size: 14px;
            color: #525252;
            border-bottom: 1px solid var(--border-color);
        }

        .doctor-row {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .doctor-row:hover {
            background-color: rgba(74, 144, 226, 0.05);
        }

        .doctor-row.selected {
            background-color: rgba(74, 144, 226, 0.1);
        }

        .doctor-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            object-fit: cover;
        }

        .doctor-name {
            display: flex;
            align-items: center;
        }

        /* Shifts Table */
        .shifts-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            margin-top: 20px;
        }

        .shifts-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .shifts-tables {
            display: flex;
            gap: 20px;
        }

        .shift-table {
            flex: 1;
        }

        .shift-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .shift-title.morning::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--primary-color);
            border-radius: 50%;
            margin-right: 8px;
        }

        .shift-title.evening::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--new-color);
            border-radius: 50%;
            margin-right: 8px;
        }

        .shift-doctors {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 10px;
            min-height: 100px;
        }

        .shift-doctor {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .shift-doctor:last-child {
            border-bottom: none;
        }

        .no-doctors {
            color: #8A92A6;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .add-btn {
            background: var(--primary-color);
            color: white;
        }

        .delete-btn {
            background: #fd6666;
            color: white;
        }

        .refresh-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
        }

        .export-btn {
            background: #28a745;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            background: #218838;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .content-wrapper {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .logo span,
            .menu-item span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>

    <div class="container">

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h2>Расписание врачей</h2>
            </div>

            <div class="action-buttons">
                <button class="action-btn add-btn">
                    <i class="fas fa-plus"></i> Добавить расписание
                </button>
                <button class="action-btn refresh-btn" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="action-btn export-btn" onclick="exportToExcel()">
                    <i class="fas fa-file-excel"></i> Выгрузить в Excel
                </button>
            </div>

            <div class="content-wrapper">
                <div class="calendar-section">
                    <div class="calendar-header">
                        <div class="month-navigation">
                            <button class="nav-btn" onclick="prevMonth()"><i class="fas fa-chevron-left"></i></button>
                            <div class="month-title" id="month-title"></div>
                            <button class="nav-btn" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        <select class="department-select" id="department-select" onchange="updateCalendar()">
                            <option value="">Все отделения</option>
                        </select>
                    </div>

                    <div class="calendar-grid" id="calendar-grid">
                        <div class="calendar-day-header">Пн</div>
                        <div class="calendar-day-header">Вт</div>
                        <div class="calendar-day-header">Ср</div>
                        <div class="calendar-day-header">Чт</div>
                        <div class="calendar-day-header">Пт</div>
                        <div class="calendar-day-header">Сб</div>
                        <div class="calendar-day-header">Вс</div>
                        <!-- Days will be inserted here by JavaScript -->
                    </div>
                </div>

                <div class="doctors-section">
                    <div class="doctors-search">
                        <input type="text" id="doctor-search" placeholder="Поиск по ФИО..." oninput="filterDoctors()">
                    </div>
                    <div class="doctors-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Врач</th>
                                    <th>Отделение</th>
                                </tr>
                            </thead>
                            <tbody id="doctors-list">
                                <!-- Doctors will be inserted here by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="shifts-container" id="shifts-container" style="display: none;">
                <div class="shifts-header">Смены на <span id="selected-date"></span></div>
                <div class="shifts-tables">
                    <div class="shift-table">
                        <div class="shift-title morning">Утренняя смена (8:00 - 14:00)</div>
                        <div class="shift-doctors" id="morning-shift"></div>
                    </div>
                    <div class="shift-table">
                        <div class="shift-title evening">Вечерняя смена (14:00 - 20:00)</div>
                        <div class="shift-doctors" id="evening-shift"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Mock data for demonstration
        const departments = [
            { id: 1, name: "Кардиология" },
            { id: 2, name: "Неврология" },
            { id: 3, name: "Педиатрия" },
            { id: 4, name: "Хирургия" },
            { id: 5, name: "Терапия" }
        ]

        const doctors = [

            {

            },
            {
                id: 3,
                firstName: "Константин",
                lastName: "Сидоров",
                patronymic: "Владимирович",
                specialization: "Педиатр",
                departmentId: 3,
                avatar: "https://i.pravatar.cc/150?img=3",
                phone_number: "+375 (29) 345-67-89",
                email: "sidorov@clinic.by"
            },
            {
                id: 4,
                firstName: "Анна",
                lastName: "Козлова",
                patronymic: "Михайловна",
                specialization: "Терапевт",
                departmentId: 4,
                avatar: "https://i.pravatar.cc/150?img=4",
                phone_number: "+375 (29) 456-78-90",
                email: "kozlova@clinic.by"
            },
            {
                id: 5,
                firstName: "Дмитрий",
                lastName: "Новиков",
                patronymic: "Александрович",
                specialization: "Хирург",
                departmentId: 5,
                avatar: "https://i.pravatar.cc/150?img=5",
                phone_number: "+375 (29) 567-89-01",
                email: "novikov@clinic.by"
            },
            {
                id: 6,
                firstName: "Мария",
                lastName: "Смирнова",
                patronymic: "Александровна",
                specialization: "Терапевт",
                departmentId: 4,
                avatar: "https://i.pravatar.cc/150?img=6",
                phone_number: "+375 (29) 123-45-67",
                email: "smirnova.ma@clinic.by"
            },
            {
                id: 7,
                firstName: "Андрей",
                lastName: "Морозов",
                patronymic: "Викторович",
                specialization: "Хирург",
                departmentId: 5,
                avatar: "https://i.pravatar.cc/150?img=7",
                phone_number: "+375 (29) 765-43-21",
                email: "morozov@clinic.by"
            },
            {
                id: 8,
                firstName: "Елена",
                lastName: "Волкова",
                patronymic: "Дмитриевна",
                specialization: "Невролог",
                departmentId: 2,
                avatar: "https://i.pravatar.cc/150?img=8",
                phone_number: "+375 (29) 678-90-12",
                email: "volkova@clinic.by"
            }
        ]

        // Generate schedules for current month
        const currentDate = new Date()
        const currentYear = currentDate.getFullYear()
        const currentMonth = currentDate.getMonth()
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate()

        const schedules = []

        // Создаем расписание на месяц
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(currentYear, currentMonth, day)
            const dayOfWeek = date.getDay()

            // Пропускаем выходные
            if (dayOfWeek === 0 || dayOfWeek === 6) continue

            // Распределяем врачей по сменам
            const availableDoctors = [...doctors] // Копия массива врачей

            // Перемешиваем массив для случайного распределения
            for (let i = availableDoctors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableDoctors[i], availableDoctors[j]] = [availableDoctors[j], availableDoctors[i]]
            }

            // Определяем количество врачей для каждой смены (2-3 врача на смену)
            const morningDoctorsCount = 2 + Math.floor(Math.random() * 2)
            const eveningDoctorsCount = 2 + Math.floor(Math.random() * 2)

            // Распределяем утреннюю смену
            for (let i = 0; i < morningDoctorsCount && i < availableDoctors.length; i++) {
                schedules.push({
                    doctorId: availableDoctors[i].id,
                    date: formatDate(date),
                    shift: "morning",
                    departmentId: availableDoctors[i].departmentId
                })
            }

            // Оставшиеся врачи могут быть назначены на вечернюю смену
            const remainingDoctors = availableDoctors.slice(morningDoctorsCount)

            // Распределяем вечернюю смену
            for (let i = 0; i < eveningDoctorsCount && i < remainingDoctors.length; i++) {
                schedules.push({
                    doctorId: remainingDoctors[i].id,
                    date: formatDate(date),
                    shift: "evening",
                    departmentId: remainingDoctors[i].departmentId
                })
            }
        }

        // Current view date and selected date/doctor
        let viewDate = new Date()
        let selectedDate = null
        let selectedDoctorId = null

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Populate department select
            const deptSelect = document.getElementById('department-select')
            departments.forEach(dept => {
                const option = document.createElement('option')
                option.value = dept.id
                option.textContent = dept.name
                deptSelect.appendChild(option)
            })

            renderCalendar()
            renderDoctorsList()
        })

        // Calendar functions
        function renderCalendar() {
            const monthTitle = document.getElementById('month-title')
            const calendarGrid = document.getElementById('calendar-grid')

            // Set month title
            const monthNames = [
                "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
                "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
            ]
            monthTitle.textContent = `${monthNames[viewDate.getMonth()]} ${viewDate.getFullYear()}`

            // Получаем первый день месяца (0 = воскресенье, 1 = понедельник, и т.д.)
            let firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay()
            // Преобразуем для недели, начинающейся с понедельника
            firstDay = firstDay === 0 ? 6 : firstDay - 1

            const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate()
            const prevMonthDays = new Date(viewDate.getFullYear(), viewDate.getMonth(), 0).getDate()

            // Clear existing day cells (keep headers)
            const dayCells = Array.from(calendarGrid.querySelectorAll('.calendar-day'))
            dayCells.forEach(cell => cell.remove())

            // Add days from previous month
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayElement = createDayElement(prevMonthDays - i, true)
                calendarGrid.appendChild(dayElement)
            }

            // Add days from current month
            const today = new Date()
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), i)
                const isToday = dayDate.getDate() === today.getDate() &&
                    dayDate.getMonth() === today.getMonth() &&
                    dayDate.getFullYear() === today.getFullYear()

                const dayElement = createDayElement(i, false, isToday)
                calendarGrid.appendChild(dayElement)
            }

            // Add days from next month
            const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7
            const remainingDays = totalCells - (firstDay + daysInMonth)

            for (let i = 1; i <= remainingDays; i++) {
                const dayElement = createDayElement(i, true)
                calendarGrid.appendChild(dayElement)
            }
        }

        function createDayElement(day, isOtherMonth, isToday = false) {
            const dayElement = document.createElement('div')
            dayElement.className = 'calendar-day'
            if (isOtherMonth) dayElement.classList.add('other-month')
            if (isToday) dayElement.classList.add('current-day')

            const dayNumber = document.createElement('div')
            dayNumber.className = 'day-number'
            dayNumber.textContent = day
            dayElement.appendChild(dayNumber)

            if (!isOtherMonth) {
                const dayDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), day)
                const formattedDate = formatDate(dayDate)
                const dayOfWeek = dayDate.getDay()
                // Преобразуем для недели, начинающейся с понедельника
                const adjustedDayOfWeek = dayOfWeek === 0 ? 6 : dayOfWeek - 1

                // Не показываем смены в выходные дни (суббота = 5, воскресенье = 6)
                if (adjustedDayOfWeek < 5) {
                    dayElement.addEventListener('click', () => {
                        selectedDate = formattedDate
                        updateShiftsDisplay(formattedDate)
                        document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected-day'))
                        dayElement.classList.add('selected-day')
                    })

                    const departmentId = document.getElementById('department-select').value
                    const dayShifts = schedules.filter(s =>
                        s.date === formattedDate &&
                        (!departmentId || s.departmentId == departmentId)
                    )

                    const morningShifts = dayShifts.filter(s => s.shift === "morning")
                    const eveningShifts = dayShifts.filter(s => s.shift === "evening")

                    const shiftsContainer = document.createElement('div')
                    shiftsContainer.className = 'day-shifts'

                    const morningElement = document.createElement('div')
                    morningElement.className = 'shift-morning'
                    morningElement.innerHTML = `<i class="fas fa-sun"></i> ${morningShifts.length} <span class="shift-time">8:00-14:00</span>`
                    shiftsContainer.appendChild(morningElement)

                    const eveningElement = document.createElement('div')
                    eveningElement.className = 'shift-evening'
                    eveningElement.innerHTML = `<i class="fas fa-moon"></i> ${eveningShifts.length} <span class="shift-time">14:00-20:00</span>`
                    shiftsContainer.appendChild(eveningElement)

                    dayElement.appendChild(shiftsContainer)
                }
            }

            return dayElement
        }

        function prevMonth() {
            viewDate.setMonth(viewDate.getMonth() - 1)
            renderCalendar()
        }

        function nextMonth() {
            viewDate.setMonth(viewDate.getMonth() + 1)
            renderCalendar()
        }

        function updateCalendar() {
            renderCalendar()
            renderDoctorsList()
        }

        // Doctors list functions
        function renderDoctorsList(filter = '') {
            const doctorsList = document.getElementById('doctors-list')
            doctorsList.innerHTML = ''

            const departmentId = document.getElementById('department-select').value
            const searchTerm = filter.toLowerCase()

            const filteredDoctors = doctors.filter(doctor => {
                const matchesDepartment = !departmentId || doctor.departmentId == departmentId
                const matchesSearch = !searchTerm ||
                    doctor.firstName.toLowerCase().includes(searchTerm) ||
                    doctor.lastName.toLowerCase().includes(searchTerm)
                return matchesDepartment && matchesSearch
            })

            if (filteredDoctors.length === 0) {
                const row = document.createElement('tr')
                row.innerHTML = `<td colspan="2" style="text-align: center; padding: 20px;">Врачи не найдены</td>`
                doctorsList.appendChild(row)
                return
            }

            filteredDoctors.forEach(doctor => {
                const row = document.createElement('tr')
                row.className = 'doctor-row'
                if (selectedDoctorId === doctor.id) {
                    row.classList.add('selected')
                }

                row.innerHTML = `
                <td>
                    <div class="doctor-name">
                        ${doctor.lastName} ${doctor.firstName} ${doctor.patronymic}
                    </div>
                </td>
                <td>${doctor.specialization}</td>
                <td>
                    <button class="download-btn" style="background-color: transparent; border-color: transparent" onclick="editDoctorSchedule(${doctor.id})">
                            <img width="40" height="40" src="https://img.icons8.com/pastel-glyph/40/4D4D4D/pencil--v2.png" alt="Редактировать"/>
                        </button>
                </td>
            `

                row.addEventListener('click', () => {
                    selectedDoctorId = doctor.id
                    document.querySelectorAll('.doctor-row').forEach(r => r.classList.remove('selected'))
                    row.classList.add('selected')
                    highlightDoctorShifts(doctor.id)
                })

                doctorsList.appendChild(row)
            })
        }

        function editDoctorSchedule(doctorId) {
            const doctor = doctors.find(d => d.id === doctorId)
            if (doctor) {
                window.location.href = `/admin/editSchedule/${doctorId}`
            }
        }

        function filterDoctors() {
            const searchTerm = document.getElementById('doctor-search').value
            renderDoctorsList(searchTerm)
        }

        function highlightDoctorShifts(doctorId) {
            // Clear previous highlights
            document.querySelectorAll('.calendar-day').forEach(day => {
                day.querySelectorAll('.shift-morning, .shift-evening').forEach(shift => {
                    shift.style.opacity = '1'
                    shift.style.fontWeight = 'normal'
                })
            })

            // Get all dates this doctor has shifts
            const doctorShifts = schedules.filter(s => s.doctorId === doctorId)
            const shiftDates = doctorShifts.map(s => s.date)

            // Highlight these dates
            document.querySelectorAll('.calendar-day').forEach(day => {
                const dayNumber = day.querySelector('.day-number').textContent
                const dayDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), dayNumber)
                const formattedDate = formatDate(dayDate)

                if (shiftDates.includes(formattedDate) && !day.classList.contains('other-month')) {
                    const shiftType = doctorShifts.find(s => s.date === formattedDate).shift
                    const highlightClass = shiftType === 'morning' ? 'shift-morning' : 'shift-evening'

                    const highlight = day.querySelector(`.${highlightClass}`)
                    if (highlight) {
                        highlight.style.opacity = '1'
                        highlight.style.fontWeight = 'bold'
                    }
                }
            })
        }

        // Shifts display functions
        function updateShiftsDisplay(date) {
            const shiftsContainer = document.getElementById('shifts-container')
            const selectedDateElement = document.getElementById('selected-date')
            const morningShiftElement = document.getElementById('morning-shift')
            const eveningShiftElement = document.getElementById('evening-shift')

            const dateObj = new Date(date)
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }
            selectedDateElement.textContent = dateObj.toLocaleDateString('ru-RU', options)

            const departmentId = document.getElementById('department-select').value

            const dayShifts = schedules.filter(s => s.date === date &&
                (!departmentId || s.departmentId == departmentId) &&
                (!selectedDoctorId || s.doctorId === selectedDoctorId))

            const morningShifts = dayShifts.filter(s => s.shift === 'morning')
            const eveningShifts = dayShifts.filter(s => s.shift === 'evening')

            morningShiftElement.innerHTML = ''
            eveningShiftElement.innerHTML = ''

            // Получаем полную информацию о врачах для каждой смены
            const morningDoctors = morningShifts.map(shift =>
                doctors.find(d => d.id === shift.doctorId)
            ).filter(Boolean)

            const eveningDoctors = eveningShifts.map(shift =>
                doctors.find(d => d.id === shift.doctorId)
            ).filter(Boolean)

            renderShiftDoctors(morningShiftElement, morningDoctors)
            renderShiftDoctors(eveningShiftElement, eveningDoctors)

            shiftsContainer.style.display = 'block'
        }

        // Функция для отображения врачей в смене
        function renderShiftDoctors(shiftElement, doctors) {
            if (doctors.length > 0) {
                const doctorsList = document.createElement('div')
                doctorsList.className = 'doctors-list'

                doctors.forEach(doctor => {
                    const doctorElement = document.createElement('div')
                    doctorElement.className = 'shift-doctor'
                    doctorElement.innerHTML = `${doctor.lastName} ${doctor.firstName} ${doctor.patronymic}`
                    doctorsList.appendChild(doctorElement)
                })

                shiftElement.appendChild(doctorsList)
            } else {
                shiftElement.innerHTML = '<div class="no-doctors">Нет назначенных врачей</div>'
            }
        }

        // Utility functions
        function formatDate(date) {
            const year = date.getFullYear()
            const month = String(date.getMonth() + 1).padStart(2, '0')
            const day = String(date.getDate()).padStart(2, '0')
            return `${year}-${month}-${day}`
        }

        function refreshData() {
            renderCalendar()
            renderDoctorsList()
            if (selectedDate) updateShiftsDisplay(selectedDate)
        }

        function exportToExcel() {
            const monthNames = [
                "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
                "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
            ]
            const currentMonth = monthNames[viewDate.getMonth()]
            const currentYear = viewDate.getFullYear()
            const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate()

            let excelData = []

            // Заголовок с форматированием
            excelData.push(['УТВЕРЖДАЮ'])
            excelData.push(['Главный врач ____________________'])
            excelData.push([`"___" ${currentMonth} ${currentYear} г.`])
            excelData.push([''])
            excelData.push([`ГРАФИК РАБОТЫ ВРАЧЕЙ НА ${currentMonth.toUpperCase()} ${currentYear} ГОДА`])
            excelData.push([''])

            // Создаем заголовки с датами
            let headers = ['№ п/п', 'ФИО врача', 'Отделение']
            let subHeaders = ['', '', '']

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), day)
                if (date.getDay() !== 0 && date.getDay() !== 6) {
                    headers.push(day)
                }
            }

            excelData.push(headers)
            excelData.push(subHeaders)

            // Группируем расписание по врачам
            const doctorSchedules = {}
            doctors.forEach((doctor, index) => {
                doctorSchedules[doctor.id] = {
                    index: index + 1,
                    name: `${doctor.lastName} ${doctor.firstName} ${doctor.patronymic}`,
                    department: doctor.specialization,
                    shifts: {}
                }
            })

            // Заполняем данные о сменах
            schedules.forEach(schedule => {
                const date = new Date(schedule.date)
                const day = date.getDate()
                const shiftNumber = schedule.shift === 'morning' ? '1' : '2'
                doctorSchedules[schedule.doctorId].shifts[day] = shiftNumber
            })

            // Добавляем данные в таблицу
            Object.values(doctorSchedules).forEach(doctor => {
                let row = [doctor.index, doctor.name, doctor.department]

                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), day)
                    if (date.getDay() !== 0 && date.getDay() !== 6) {
                        row.push(doctor.shifts[day] || '-')
                    }
                }
                excelData.push(row)
            })

            // Добавляем легенду
            excelData.push([''])
            excelData.push(['Условные обозначения:'])
            excelData.push(['1 - первая смена (08:00 - 14:00)'])
            excelData.push(['2 - вторая смена (14:00 - 20:00)'])
            excelData.push(['\'-  - выходной'])
            excelData.push([''])
            excelData.push([''])
            excelData.push(['Начальник отдела кадров ____________________'])
            excelData.push([''])
            excelData.push(['Старшая медсестра ____________________'])

            // Создаем CSV строку с дополнительным форматированием
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"
            excelData.forEach(row => {
                // Добавляем кавычки для всех значений, чтобы сохранить форматирование
                const formattedRow = row.map(cell => `"${cell}"`)
                csvContent += formattedRow.join(';') + '\n'
            })

            const encodedUri = encodeURI(csvContent)
            const link = document.createElement("a")
            link.setAttribute("href", encodedUri)
            link.setAttribute("download", `График_работы_врачей_${currentMonth}_${currentYear}.csv`)
            document.body.appendChild(link)
            link.click()
            document.body.removeChild(link)
        }
    </script>
</body>
