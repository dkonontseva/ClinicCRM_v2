<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат врача</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #272b41;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: #ffffff;
            padding: 20px;
            height: 100vh;
            position: fixed;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.05);
        }

        .doctor-profile {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .doctor-profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 8px 8px 16px #e6e6e6, -8px -8px 16px #ffffff;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .nav-menu .nav-item {
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 10px;
            color: #272b41;
            display: flex;
            align-items: center;
            box-shadow: 4px 4px 8px #e6e6e6, -4px -4px 8px #ffffff;
            text-decoration: none;
        }

        .nav-item.active {
            background: #4a90e2;
            color: white;
        }

        .nav-item:hover {
            background: rgba(74, 144, 226, 0.36);
            color: white;
        }

        .logout {
            padding: 12px 20px;
            color: #272b41;
            margin-top: 150%;
            text-decoration: none;
        }

        .main-content {
            margin-left: 280px;
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-header-info h2 {
            font-size: 18px;
            color: #272b41;
            margin-bottom: 4px;
        }

        .chat-header-info p {
            font-size: 14px;
            color: #757575;
        }

        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            position: relative;
            line-height: 1.5;
        }

        .message.received {
            background: #f0f2f5;
            color: #272b41;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            background: #4a90e2;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message-info {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .message.sent .message-info {
            text-align: right;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #4a90e2;
        }

        .send-button {
            background: #4a90e2;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background: #357abd;
        }

        .date-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .date-divider span {
            background: white;
            padding: 0 10px;
            color: #757575;
            font-size: 12px;
            position: relative;
            z-index: 1;
        }

        .date-divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #eee;
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="doctor-profile">
            <img src="https://picsum.photos/200/200?random=1" alt="Doctor Profile">
        </div>
        <div class="nav-menu">
            <a href="/doctor/dashboard" class="nav-item">Дашборд</a>
            <a href="/doctor/myLeaves" class="nav-item">Мои заявления</a>
            <a href="/doctor/patientsCards" class="nav-item">Мед. карты пациентов</a>
            <a href="/doctor/profile" class="nav-item">Профиль</a>
            <a href="/doctor/chat" class="nav-item active">Чат</a>
            <a href="/doctor/video" class="nav-item">Видеочат</a>
            <a href='/' class="logout">Выход</a>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div id="chat-window" class="chat-window">
                <div class="date-divider">
                    <span>Сегодня</span>
                </div>
                <!-- Mock messages will be loaded here -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="message-input" class="chat-input" placeholder="Введите сообщение...">
                <button id="send-button" class="send-button">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Mock messages data
        const mockMessages = [
            {
                text: "Здравствуйте, коллеги! Сегодня я хочу поговорить о том, как мы можем улучшить нашу работу.",
                timestamp: "09:30",
                type: "received",
                sender: "Лишкович В. И."
            },
            {
                text: "Здравствуйте! А какие у вас предложения?",
                timestamp: "09:32",
                type: "received",
                sender: "Иванова А. С."
            },
            {
                text: "Предлагаю обсудить это в обеденный перерыв.",
                timestamp: "09:33",
                type: "sent",
                sender: "Вы"
            },
            {
                text: "Отлично, тогда встретимся в 13:00 в общей комнате",
                timestamp: "09:36",
                type: "received",
                sender: "Лишкович В. И."
            },
            {
                text: "До встречи!",
                timestamp: "09:40",
                type: "sent",
                sender: "Вы"
            },
            {
                text: "До встречи!",
                timestamp: "09:41",
                type: "received",
                sender: "Лишкович В. И."
            }
        ]

        // Function to add a message to the chat window
        function addMessage(message) {
            const messageElement = document.createElement('div')
            messageElement.className = `message ${message.type}`
            messageElement.innerHTML = `
            <div class="message-text">${message.text}</div>
            <div class="message-info">
                <span class="message-sender">${message.sender}</span> • 
                <span class="message-time">${message.timestamp}</span>
            </div>
        `
            document.getElementById('chat-window').appendChild(messageElement)
        }

        // Load mock messages
        document.addEventListener('DOMContentLoaded', () => {
            mockMessages.forEach(message => addMessage(message))
            scrollToBottom()
        })

        // Handle sending new messages
        document.getElementById('send-button').addEventListener('click', sendMessage)
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage()
            }
        })

        function sendMessage() {
            const input = document.getElementById('message-input')
            const message = input.value.trim()

            if (message) {
                const newMessage = {
                    text: message,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    type: 'sent',
                    sender: 'Др. Смирнова М.А.'
                }

                addMessage(newMessage)
                scrollToBottom()
                input.value = ''
            }
        }

        function scrollToBottom() {
            const chatWindow = document.getElementById('chat-window')
            chatWindow.scrollTop = chatWindow.scrollHeight
        }
    </script>
</body>

</html>
