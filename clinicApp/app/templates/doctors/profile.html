<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля врача</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #ffffff;
            padding: 20px;
            height: 100vh;
            position: fixed;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.05);
        }

        .doctor-profile {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .doctor-profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 8px 8px 16px #e6e6e6, -8px -8px 16px #ffffff;
        }

        .doctor-info h3 {
            color: #272b41;
            font-size: 18px;
        }

        .doctor-info p {
            color: #757575;
            font-size: 14px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .nav-menu .nav-item {
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 10px;
            color: #272b41;
            display: flex;
            align-items: center;
            box-shadow: 4px 4px 8px #e6e6e6, -4px -4px 8px #ffffff;
            text-decoration: none;
        }

        .nav-item.active {
            background: #4a90e2;
            color: white;
        }

        .nav-item:hover {
            background: rgba(74, 144, 226, 0.36);
            color: white;
        }

        .logout {
            padding: 12px 20px;
            color: #272b41;
            margin-top: 190%;
            text-decoration: none;
        }

        .main-content {
            margin-left: 280px;
            padding: 30px;
            flex: 1;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }

        .profile-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 8px 8px 16px #e6e6e6, -8px -8px 16px #ffffff;
            margin-top: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #4a90e2;
            font-weight: bold;
            border-bottom: 2px solid #4a90e2;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .section-heading {
            font-size: 18px;
            color: #333;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .save-btn {
            background: #4a90e2;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            font-size: 16px;
            box-shadow: 4px 4px 8px #e6e6e6, -4px -4px 8px #ffffff;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 12px #e6e6e6, -6px -6px 12px #ffffff;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .gender-option {
            padding: 10px 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked+.gender-option {
            background: #4a90e2;
            color: white;
            border-color: #4a90e2;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="doctor-profile">
            <img src="https://picsum.photos/200/200?random=1" alt="Фото врача">
        </div>
        <div class="nav-menu">
            <a href="/doctor/dashboard" class="nav-item">Дашборд</a>
            <a href="/doctor/myLeaves" class="nav-item">Мои заявления</a>
            <a href="/doctor/patientsCards" class="nav-item">Мед. карты пациентов</a>
            <a href="/doctor/profile" class="nav-item active">Профиль</a>
            <a href="/doctor/chat" class="nav-item">Чат</a>
            <a href="/doctor/video" class="nav-item">Видеочат</a>
            <a href='/' class="logout">Выход</a>
        </div>
    </div>

    <div class="main-content">
        <h1 class="section-title">Настройки профиля</h1>

        <div class="profile-container">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('user')">Основная информация</div>
                <div class="tab" onclick="switchTab('building')">Адрес</div>
                <div class="tab" onclick="switchTab('graduation')">Образование</div>
                <div class="tab" onclick="switchTab('lock')">Изменить пароль</div>
            </div>

            <!-- Basic Information -->
            <div id="user" class="tab-content">
                <form id="profile-form" onsubmit="updateProfile(event)">
                    <div class="section-heading">Основная информация</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Имя</label>
                            <input type="text" class="form-control" name="first_name" id="first_name" value="Мария">
                        </div>
                        <div class="form-group">
                            <label>Отчество</label>
                            <input type="text" class="form-control" name="second_name" id="second_name"
                                value="Александровна">
                        </div>
                        <div class="form-group">
                            <label>Фамилия</label>
                            <input type="text" class="form-control" name="last_name" id="last_name" value="Смирнова">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" name="email" id="email"
                                value="smirnova.ma@clinic.by">
                        </div>
                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="tel" class="form-control" name="phone_number" id="phone_number"
                                value="+375 29 123-45-67">
                        </div>
                        <div class="form-field">
                            <label>Пол</label>
                            <div class="gender-options">
                                <input type="radio" id="male" name="gender" value="male">
                                <label for="male" class="gender-option">Мужской</label>
                                <input type="radio" id="female" name="gender" value="female" checked>
                                <label for="female" class="gender-option">Женский</label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="save-btn">Сохранить изменения</button>
                </form>
            </div>

            <!-- Address Information -->
            <div id="building" class="tab-content" style="display: none;">
                <form onsubmit="updateProfile(event)">
                    <div class="section-heading">Адрес</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Страна</label>
                            <input type="text" class="form-control" name="country" id="country" value="Беларусь">
                        </div>
                        <div class="form-group">
                            <label>Город</label>
                            <input type="text" class="form-control" name="city" id="city" value="Минск">
                        </div>
                        <div class="form-group">
                            <label>Улица</label>
                            <input type="text" class="form-control" name="street" id="street" value="пр. Независимости">
                        </div>
                        <div class="form-group">
                            <label>Дом</label>
                            <input type="text" class="form-control" name="house" id="house" value="95">
                        </div>
                        <div class="form-group">
                            <label>Квартира</label>
                            <input type="text" class="form-control" name="flat" id="flat" value="42">
                        </div>
                    </div>
                    <button type="submit" class="save-btn">Сохранить изменения</button>
                </form>
            </div>

            <!-- Education -->
            <div id="graduation" class="tab-content" style="display: none;">
                <form onsubmit="updateProfile(event)">
                    <div class="section-heading">Образование</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Университет</label>
                            <input type="text" class="form-control" name="university" id="university"
                                value="Белорусский государственный медицинский университет">
                        </div>
                        <div class="form-group">
                            <label>Факультет</label>
                            <input type="text" class="form-control" name="faculty" id="faculty"
                                value="Лечебный факультет">
                        </div>
                        <div class="form-group">
                            <label>Специализация</label>
                            <input type="text" class="form-control" name="specialization" id="specialization"
                                value="Терапевт">
                        </div>
                    </div>
                    <button type="submit" class="save-btn">Сохранить изменения</button>
                </form>
            </div>

            <!-- Change Password -->
            <div id="lock" class="tab-content" style="display: none;">
                <form onsubmit="updatePassword(event)">
                    <div class="section-heading">Изменить пароль</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Текущий пароль</label>
                            <input type="password" class="form-control" name="old-password" id="old-password"
                                placeholder="Введите текущий пароль">
                        </div>
                        <div class="form-group">
                            <label>Новый пароль</label>
                            <input type="password" class="form-control" name="new-password" id="new-password"
                                placeholder="Введите новый пароль">
                        </div>
                        <div class="form-group">
                            <label>Повторите пароль</label>
                            <input type="password" class="form-control" name="repeat-password" id="repeat-password"
                                placeholder="Повторите новый пароль">
                        </div>
                    </div>
                    <button type="submit" class="save-btn">Сохранить изменения</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const urlParams = new URLSearchParams(window.location.search)
                const doctorId = urlParams.get('id')
                //
                // if (!doctorId) {
                //     showError('Doctor ID not provided')
                //     return
                // }

                // Имитация загрузки данных профиля
                const mockProfileData = {
                    users: {
                        first_name: "Мария",
                        last_name: "Смирнова",
                        second_name: "Александровна",
                        login: "smirnova.ma@clinic.by",
                        phone_number: "+375 29 123-45-67",
                        gender: "female"
                    },
                    addresses: {
                        country: "Беларусь",
                        city: "Минск",
                        street: "пр. Независимости",
                        house_number: "95",
                        flat_number: "42"
                    },
                    education: {
                        university: "Белорусский государственный медицинский университет",
                        faculty: "Лечебный факультет",
                        speciality: "Терапевт"
                    }
                }

                populateProfileForm(mockProfileData)

            } catch (error) {
                showError(error.message || 'Failed to load profile data')
            }
        })

        function populateProfileForm(data) {
            // Заполняем поля формы данными о враче
            document.getElementById('first_name').value = data.users.first_name || ''
            document.getElementById('last_name').value = data.users.last_name || ''
            document.getElementById('second_name').value = data.users.second_name || ''
            document.getElementById('email').value = data.users.login || ''
            document.getElementById('phone_number').value = data.users.phone_number || ''
            document.querySelector(`input[name="gender"][value="${data.users.gender}"]`).checked = true

            // Образование
            document.getElementById('university').value = data.education.university || ''
            document.getElementById('faculty').value = data.education.faculty || ''
            document.getElementById('specialization').value = data.education.speciality || ''

            // Адрес
            document.getElementById('country').value = data.addresses.country || ''
            document.getElementById('city').value = data.addresses.city || ''
            document.getElementById('street').value = data.addresses.street || ''
            document.getElementById('house').value = data.addresses.house_number || ''
            document.getElementById('flat').value = data.addresses.flat_number || ''
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none')
            document.querySelector(`#${tab}`).style.display = 'block'

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active')
        }

        async function updateProfile(event) {
            event.preventDefault()
            const form = event.target
            const formData = new FormData(form)

            try {
                // Здесь будет отправка данных на сервер
                console.log('Profile updated successfully')
                alert('Профиль успешно обновлен')
            } catch (error) {
                console.error('Error updating profile:', error)
                alert('Ошибка при обновлении профиля')
            }
        }

        async function updatePassword(event) {
            event.preventDefault()
            const oldPassword = document.getElementById('old-password').value
            const newPassword = document.getElementById('new-password').value
            const repeatPassword = document.getElementById('repeat-password').value

            if (newPassword !== repeatPassword) {
                alert('Новые пароли не совпадают')
                return
            }

            try {
                // Здесь будет отправка данных на сервер
                console.log('Password updated successfully')
                alert('Пароль успешно обновлен')
                event.target.reset()
            } catch (error) {
                console.error('Error updating password:', error)
                alert('Ошибка при обновлении пароля')
            }
        }

        function showError(message) {
            alert(message)
        }
    </script>
</body>

</html>

</html>
